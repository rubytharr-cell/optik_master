<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Адмін · Майстер-оптик</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f5f3;color:#1a1917;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;line-height:1.5;min-height:100vh}
:root{--w:#fff;--border:#e4e1dc;--b2:#ccc9c2;--text:#1a1917;--mu:#7c7a76;--acc:#2563eb;--ach:#1d4ed8;--ok:#16a34a;--err:#dc2626;--sh:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04)}
a{color:var(--acc)}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 80px}
h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.muted{font-size:12px;color:var(--mu)}
.btn{padding:9px 15px;border-radius:9px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btnp{background:var(--acc);color:#fff}.btnp:hover{background:var(--ach)}
.btns{background:var(--w);color:var(--text);border:1px solid var(--border)}.btns:hover{border-color:var(--b2)}
.btnd{background:none;color:var(--err);border:1px solid var(--border)}.btnd:hover{border-color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* login */
.login{max-width:340px;margin:14vh auto 0;background:var(--w);border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:var(--sh)}
.login h1{margin-bottom:4px}
.login .muted{margin-bottom:18px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--mu);margin-bottom:5px;font-weight:500}
.fld input,.fld textarea,.fld select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--w);color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:.15s}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.fld textarea{resize:vertical;min-height:60px}
.msg{font-size:12px;margin-top:8px}
.msg.e{color:var(--err)}.msg.k{color:var(--ok)}

/* tabs */
.tabs{display:flex;gap:2px;background:var(--border);border-radius:9px;padding:3px;margin-bottom:18px;width:max-content}
.tab{padding:6px 16px;border-radius:6px;border:none;background:none;color:var(--mu);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.tab.on{background:var(--w);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* list */
.row{display:flex;gap:12px;align-items:center;background:var(--w);border:1px solid var(--border);border-radius:11px;padding:10px;margin-bottom:8px;box-shadow:var(--sh)}
.row.off{opacity:.5}
.thumb{width:64px;height:48px;border-radius:7px;object-fit:cover;background:#f0efec;flex-shrink:0}
.thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--b2);font-size:10px}
.row-main{flex:1;min-width:0}
.row-main b{font-size:13px}
.row-main div{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-act{display:flex;gap:6px;flex-shrink:0}
.row-act .btn{padding:6px 10px;font-size:12px}

/* editor */
.card{background:var(--w);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--sh);margin-bottom:18px}
.card h2{font-size:15px;font-weight:700;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input{width:16px;height:16px}
.preview{width:100%;max-height:170px;object-fit:contain;border-radius:9px;background:#f0efec;margin-top:8px;display:none}
.hintx{font-size:11px;color:var(--mu);margin-top:4px}
.bar{display:flex;gap:8px;margin-top:16px}
.empty{text-align:center;color:var(--mu);font-size:13px;padding:30px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <h1>Адмін-панель</h1>
  <div class="muted">Майстер-оптик — керування каталогом</div>
  <div class="fld"><label>Email</label><input id="li-email" type="email" autocomplete="username"></div>
  <div class="fld"><label>Пароль</label><input id="li-pass" type="password" autocomplete="current-password"></div>
  <button class="btn btnp" style="width:100%" id="li-btn" onclick="login()">Увійти</button>
  <div id="li-msg" class="msg e"></div>
</div>

<!-- APP -->
<div id="app" class="wrap" hidden>
  <div class="top">
    <div><h1>Каталог</h1><div class="muted" id="who"></div></div>
    <div style="display:flex;gap:8px">
      <a class="btn btns" href="index.html" target="_blank">Відкрити сайт</a>
      <button class="btn btns" onclick="logout()">Вийти</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" id="tab-p" onclick="showTab('p')">Готові окуляри</button>
    <button class="tab" id="tab-f" onclick="showTab('f')">Оправи</button>
  </div>

  <div id="editor"></div>

  <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
    <button class="btn btnp" onclick="newItem()">+ Додати</button>
  </div>
  <div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://blqvrxzuovmunmybonzb.supabase.co';
const SUPA_KEY='sb_publishable_FpEwYLAa2FPbLAOABHw2vA_IogMdW7h';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);

let TAB='p';           // p = products, f = frames
let ITEMS=[];
let editing=null;      // null = nothing, {} = new, {..row} = editing
let pendingFile=null;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const table=()=>TAB==='p'?'products':'frames';
const csv=a=>(a||[]).join(', ');
const parseCsv=s=>s.split(',').map(x=>x.trim()).filter(Boolean);

// ── AUTH ──
async function login(){
  const email=document.getElementById('li-email').value.trim();
  const pass=document.getElementById('li-pass').value;
  const m=document.getElementById('li-msg');const b=document.getElementById('li-btn');
  m.textContent='';b.disabled=true;b.textContent='…';
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  b.disabled=false;b.textContent='Увійти';
  if(error){
    console.error(error);
    m.textContent=/confirm/i.test(error.message)?'Email не підтверджено — підтвердіть користувача в Supabase (Authentication → Users)':(error.message||'Помилка входу');
    return;
  }
  boot();
}
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){document.getElementById('login').hidden=false;document.getElementById('app').hidden=true;return}
  document.getElementById('login').hidden=true;
  document.getElementById('app').hidden=false;
  document.getElementById('who').textContent=user.email;
  load();
}

// ── LIST ──
async function load(){
  editing=null;pendingFile=null;renderEditor();
  document.getElementById('list').innerHTML='<div class="empty">Завантаження…</div>';
  const {data,error}=await sb.from(table()).select('*').order('sort').order('id');
  if(error){document.getElementById('list').innerHTML='<div class="empty">Помилка: '+esc(error.message)+'</div>';return}
  ITEMS=data||[];renderList();
}
function renderList(){
  const el=document.getElementById('list');
  if(!ITEMS.length){el.innerHTML='<div class="empty">Поки що порожньо. Натисніть «+ Додати».</div>';return}
  el.innerHTML=ITEMS.map(it=>{
    const sub=TAB==='p'
      ? [csv(it.colors), (it.diopters&&it.diopters.length?it.diopters.length+' діопт.':'')].filter(Boolean).join(' · ')
      : [it.category, it.shape, csv(it.colors)].filter(Boolean).join(' · ');
    return `<div class="row${it.active?'':' off'}">
      ${it.photo_url?`<img class="thumb" src="${esc(it.photo_url)}">`:`<div class="thumb ph">нема фото</div>`}
      <div class="row-main"><b>${esc(it.name)}</b><div>${esc(sub||'—')}</div></div>
      <div class="row-act">
        <button class="btn btns" onclick="editItem(${it.id})">Змінити</button>
        <button class="btn btnd" onclick="delItem(${it.id})">✕</button>
      </div>
    </div>`;
  }).join('');
}

// ── EDITOR ──
function newItem(){editing=TAB==='p'
  ?{name:'',description:'',tags:[],colors:[],diopters:[],photo_url:null,sort:0,active:true}
  :{name:'',shape:'rect',category:'metal',colors:[],photo_url:null,sort:0,active:true};
  pendingFile=null;renderEditor();scrollTo({top:0,behavior:'smooth'});}
function editItem(id){editing={...ITEMS.find(x=>x.id===id)};pendingFile=null;renderEditor();scrollTo({top:0,behavior:'smooth'});}
function cancelEdit(){editing=null;pendingFile=null;renderEditor()}

function renderEditor(){
  const el=document.getElementById('editor');
  if(!editing){el.innerHTML='';return}
  const e=editing;const isP=TAB==='p';
  el.innerHTML=`<div class="card">
    <h2>${e.id?'Редагувати':'Нова позиція'} · ${isP?'готові окуляри':'оправа'}</h2>
    <div class="fld"><label>Назва *</label><input id="e-name" value="${esc(e.name)}"></div>
    ${isP?`
      <div class="fld"><label>Опис</label><textarea id="e-desc">${esc(e.description||'')}</textarea></div>
      <div class="grid2">
        <div class="fld"><label>Теги</label><input id="e-tags" value="${esc(csv(e.tags))}"><div class="hintx">через кому: Метал, Прямокутні</div></div>
        <div class="fld"><label>Кольори</label><input id="e-colors" value="${esc(csv(e.colors))}"><div class="hintx">через кому</div></div>
      </div>
      <div class="fld"><label>Діоптрії</label><input id="e-diopters" value="${esc(csv(e.diopters))}"><div class="hintx">через кому: +1.00, +1.50, +2.00 …</div></div>
    `:`
      <div class="grid2">
        <div class="fld"><label>Форма</label><select id="e-shape">
          <option value="rect"${e.shape==='rect'?' selected':''}>Прямокутна / вайфарер</option>
          <option value="round"${e.shape==='round'?' selected':''}>Кругла / котяче око</option>
          <option value="rimless"${e.shape==='rimless'?' selected':''}>Без оправи</option>
        </select><div class="hintx">лише для іконки, якщо немає фото</div></div>
        <div class="fld"><label>Матеріал</label><select id="e-category">
          <option value="metal"${e.category==='metal'?' selected':''}>Метал</option>
          <option value="plastic"${e.category==='plastic'?' selected':''}>Пластик</option>
          <option value="rimless"${e.category==='rimless'?' selected':''}>Без оправи</option>
        </select></div>
      </div>
      <div class="fld"><label>Кольори</label><input id="e-colors" value="${esc(csv(e.colors))}"><div class="hintx">через кому: Чорний, Золото, Срібло</div></div>
    `}
    <div class="fld"><label>Фото</label>
      <input id="e-file" type="file" accept="image/*" onchange="onFile(event)">
      <img class="preview" id="e-preview" ${e.photo_url?`src="${esc(e.photo_url)}" style="display:block"`:''}>
    </div>
    <div class="grid2">
      <div class="fld"><label>Порядок</label><input id="e-sort" type="number" value="${e.sort||0}"><div class="hintx">менше — вище у списку</div></div>
      <div class="fld"><label>&nbsp;</label><label class="chk"><input id="e-active" type="checkbox" ${e.active?'checked':''}> Показувати на сайті</label></div>
    </div>
    <div class="bar">
      <button class="btn btnp" id="e-save" onclick="save()">Зберегти</button>
      <button class="btn btns" onclick="cancelEdit()">Скасувати</button>
      <div id="e-msg" class="msg e" style="align-self:center"></div>
    </div>
  </div>`;
}
function onFile(ev){
  pendingFile=ev.target.files[0]||null;
  const p=document.getElementById('e-preview');
  if(pendingFile){p.src=URL.createObjectURL(pendingFile);p.style.display='block'}
}

async function save(){
  const msg=document.getElementById('e-msg');const btn=document.getElementById('e-save');
  const name=document.getElementById('e-name').value.trim();
  if(!name){msg.textContent='Вкажіть назву';return}
  msg.textContent='';btn.disabled=true;btn.textContent='Збереження…';

  let photo_url=editing.photo_url||null;
  if(pendingFile){
    const folder=TAB==='p'?'products':'frames';
    const ext=(pendingFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const up=await sb.storage.from('photos').upload(path,pendingFile,{cacheControl:'3600'});
    if(up.error){msg.textContent='Фото: '+up.error.message;btn.disabled=false;btn.textContent='Зберегти';return}
    photo_url=sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
  }

  const rec=TAB==='p'?{
    name,description:document.getElementById('e-desc').value.trim(),
    tags:parseCsv(document.getElementById('e-tags').value),
    colors:parseCsv(document.getElementById('e-colors').value),
    diopters:parseCsv(document.getElementById('e-diopters').value),
    photo_url,sort:+document.getElementById('e-sort').value||0,
    active:document.getElementById('e-active').checked
  }:{
    name,shape:document.getElementById('e-shape').value,category:document.getElementById('e-category').value,
    colors:parseCsv(document.getElementById('e-colors').value),
    photo_url,sort:+document.getElementById('e-sort').value||0,
    active:document.getElementById('e-active').checked
  };

  let res;
  if(editing.id) res=await sb.from(table()).update(rec).eq('id',editing.id);
  else res=await sb.from(table()).insert(rec);
  btn.disabled=false;btn.textContent='Зберегти';
  if(res.error){msg.textContent=res.error.message;return}
  load();
}

async function delItem(id){
  const it=ITEMS.find(x=>x.id===id);
  if(!confirm(`Видалити «${it?.name}»?`))return;
  const {error}=await sb.from(table()).delete().eq('id',id);
  if(error){alert(error.message);return}
  load();
}

function showTab(t){
  TAB=t;
  document.getElementById('tab-p').classList.toggle('on',t==='p');
  document.getElementById('tab-f').classList.toggle('on',t==='f');
  load();
}

boot();
</script>
</body>
</html>
